[project]
name = "bookvie"
version = "2.2.0"
description = "Local-first home library and reading tracker."
readme = { text = "bookvie: a local-first home library and reading tracker.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<2.15",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.20,<0.1",
    "pillow>=13,<14",
    "mcp>=2.3.0,<2.4",
    "httpx2>=2.16.2,<2.17",
    "dropbox>=12.2.5,<12.3",
    "keyring>=25.7.0,<25.8",
    "requests>=2.34,<2.35",
]

[project.scripts]
bookvie = "bookvie.cli:main"
bookvie-dropbox = "bookvie_dropbox.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7.1,<7.2",
    "hypothesis>=6.170,<6.171",
    "httpx>=0.28,<0.29",
    "ruff>=0.16.6,<0.17",
    "pytest-xdist>=3.8,<3.9",
]

[build-system]
requires = ["hatchling>=1.33,<1.34"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookvie", "bookvie_dropbox"]
artifacts = ["bookvie/http/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line length; the few lines it can't wrap are long strings.
ignore = ["E501"]
