[project]
name = "bookvie"
version = "0.1.0"
description = "Local-first home library and reading tracker."
readme = { text = "bookvie: a local-first home library and reading tracker.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<2.15",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.20,<0.1",
    "pillow>=13,<14",
]

[project.scripts]
bookvie = "bookvie.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7.1,<7.2",
    "hypothesis>=6.170,<6.171",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["hatchling>=1.33,<1.34"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookvie"]
artifacts = ["bookvie/http/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
