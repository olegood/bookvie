# Quality pipeline: the same four steps as `npm run check`, as separate jobs,
# plus a Playwright burn-in on PRs and weekly. Each job calls the npm script a
# developer runs locally, so a red job reproduces with that script.
# Generated by the BMad TEA `ci` workflow; see docs/ci.md.

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly burn-in, Sundays 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every master push runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # check:api: API contract diff, type check, oxlint, src/api unit tests. Fast, so it gates the rest.
  lint:
    name: Lint (check:api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run check:api

  # check:py: pytest with the per-package coverage gates (90% domain, 80% intents+store).
  backend:
    name: Backend (check:py)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frontend: "false"
      - run: npm run check:py
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/.coverage.json
          retention-days: 14
          if-no-files-found: ignore

  # check:e2e: builds the SPA, then runs Playwright (CI=true: 2 workers, 2 retries, forbidOnly).
  e2e:
    name: E2E (shard ${{ matrix.shard }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The suite runs in seconds, so one shard. When it passes ~5 minutes,
        # split it: shard: ["1/2", "2/2"].
        shard: ["1/1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: npm run build
      - run: npm --prefix frontend run e2e -- --shard="${{ matrix.shard }}"
      - name: Every discovered test ran
        run: node scripts/e2e-count.mjs --shard="${{ matrix.shard }}"
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "/" is not allowed in artifact names.
          name: e2e-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # check:smoke: builds, installs bookvie with `uv tool install` into a temp dir, starts it.
  smoke:
    name: Install smoke (check:smoke)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run check:smoke

  # Burn-in: the whole e2e suite 10 times with retries off, so a test that
  # only passes on retry fails here. The full suite is cheap enough that no
  # changed-spec selection is needed (and backend changes would escape it).
  burn-in:
    name: Burn-in (e2e x10)
    needs: e2e
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # Builds, runs every test 10 times, then checks all 10x ran (e2e-count.mjs).
      - run: npm run e2e:burn-in
      - name: Upload burn-in failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burn-in-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # One status to require in branch protection: fails unless every check
  # passed and burn-in passed or was skipped (push to master).
  report:
    name: CI gate
    needs: [lint, backend, e2e, smoke, burn-in]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and gate
        env:
          LINT: ${{ needs.lint.result }}
          BACKEND: ${{ needs.backend.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
          BURN_IN: ${{ needs.burn-in.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Test pipeline"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint (check:api) | $LINT |"
            echo "| Backend (check:py) | $BACKEND |"
            echo "| E2E (check:e2e) | $E2E |"
            echo "| Install smoke (check:smoke) | $SMOKE |"
            echo "| Burn-in (e2e x10) | $BURN_IN |"
            if [ "$BURN_IN" = "failure" ]; then
              echo
              echo "**Flaky tests:** a test failed during burn-in. See the \`burn-in-failures\` artifact."
            fi
            echo
            echo "Reports, traces and coverage: [artifacts for this run]($RUN_URL#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$LINT" "$BACKEND" "$E2E" "$SMOKE"; do
            [ "$result" = "success" ] || exit 1
          done
          [ "$BURN_IN" = "success" ] || [ "$BURN_IN" = "skipped" ]
