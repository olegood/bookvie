[project]
name = "bookvie"
version = "0.1.0"
description = "Track books, reading progress and reading sequences."
readme = "README.md"
authors = [
    { name = "Oleg Anastassov", email = "oleg.anastassov@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bookvie = "bookvie:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookvie"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
