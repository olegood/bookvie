# Team overrides for bmad-retrospective. Committed; applies to every developer.
# Merges over .claude/skills/bmad-retrospective/customize.toml (lists append,
# arrays of tables merge by `code`/`id`).

[workflow]

persistent_facts = [
  """Spine policy (AGENTS.md "Architecture spine"; Epic 3 retro item 24). The spine is reconciled once per epic. In Phase 4, always propose one action item, due before the next epic, to reconcile ARCHITECTURE-SPINE.md with this epic: list each `deferred-work.md` entry that carries the marker "spine drift" in any letter case (entries usually write "Spine drift", so compare case-insensitively) and has no `resolved:` line, with the AD it names. Take every such entry, whatever its `source_spec`: this epic's stories, its retro-item specs (`spec-epic-*`) and any standalone spec since the last reconciliation, because the next-epic gate blocks on all of them (back-to-top review, 2026-11-18). Also scan this epic's spine-check findings for drift deferred without the marker, and list those too. If there are none, still record in the document that the spine was checked and needs no reconciliation, and propose no item. Story-level deferral of spine drift is the policy, not a finding; a finding is drift that never reached `deferred-work.md`, or a spine-check finding where the code breaks a decision.""",
  """Concrete action items (Epic 3 retro item 31; PL-10 and the follow-through table). In Phase 4, every action item, and above all every process item, names the file or files it will change and when it is due, so a later retro can check it by `git log` on that file. Write both into the action text itself, since `--add-action` stores only the action, owner and ref: end it with "Changes: `<path>`[, `<path>`]. Due: <trigger>.", for example "Changes: `_bmad/custom/bmad-code-review.toml`. Due: before Epic 5." The trigger is an event a later step can check (now, before story X.Y, before Epic N, at Epic N planning), never a vague "soon" or "later". A process lesson that would change no file is not an action item: record it under Findings as accept (or watch) instead. When an item is re-scoped to a later trigger, the new action text states the new trigger, and the follow-through in the next retro checks the named files.""",
  """Close the epic (Epic 15 retro item 103, E15-T1). `sprint_status.py update` sets only the retro key, and no other step sets an epic's status, so Epic 14 stayed `backlog` after its retro. In Phase 5, when `pending_stories` is empty, also set the epic's own key `epic-{N}` to `done` in `sprint-status.yaml`, whatever the verdict (`done` there means every story is done, as the file's header defines it). Do it after the script's `update` call, as one exact-line edit of `  epic-{N}: <old>` to `  epic-{N}: done`, then run `detect-epic --epic {N}` again to confirm the file still parses. Commit it in the same commit as the retro document and the script's write. When `pending_stories` is not empty, leave the epic's key as it is.""",
]
