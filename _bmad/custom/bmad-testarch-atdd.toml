# Team overrides for bmad-testarch-atdd. Committed; applies to every developer.
# Merges over .claude/skills/bmad-testarch-atdd/customize.toml (lists append).

[workflow]

persistent_facts = [
  """Probe every new measuring helper before the red run (Epic 8 retro item 66, PL-3). "Fails at its first assertion" can't tell a missing feature from a broken helper: in Story 8.2 all 7 red leaves failed at their first assertion, yet the pixel-sampling helper had three bugs that the build fixed without changing an assertion. When: in step 5, before the checklist is finalized, and before any red run (activating the skipped leaves to watch them fail), whether or not a red run happens. What: each measuring helper this run adds or changes, in e2e or unit tests: pixel or color sampling, geometry (rects, offsets, overlap), a wait or poll, a parser of rendered text. How: run it once against a known-good input whose right answer you know without the feature. Use either a `page.setContent` fixture you build with the exact value (a 10px `rgb(…)` block at a known offset, a box of known size), or a part of the app that already ships and shows the measured thing (an existing spine color, an existing element's rect). Check that it returns that exact value, and also that it refuses a value it should reject (a different color, an off-by-one rect), so a helper that always passes or always fails is caught. Run the probe under the same conditions as the leaves that call the helper: the same viewport, `deviceScaleFactor`, color scheme and forced-colors setting, once per distinct setting they use. Where: a temporary file named `*.probe.spec.ts` under `frontend/e2e/` (or `*.probe.test.ts` beside a unit helper), removed with `rm` afterwards, never with a git command (AGENTS.md "Story pipeline", Epic 8 retro item 64). The same goes for any throwaway un-skipped copy used for the red run. Before the checklist is finalized, `git status` must list no `*.probe.*` file and no throwaway copy. A helper this run reuses unchanged needs no probe; say so. If a probe returns the wrong value, fix the helper and probe again. Any change to a probed helper after its probe, including a fix the red run prompted, voids that probe and every red result recorded since: probe it again, then redo the red run.""",
  """No leaf reads the page before it has rendered (Epic 8 retro item 66, PL-3). In Story 8.1, a leaf read tile names right after `goto`, and the build hit that race. When: in step 5, before the checklist is finalized and before any red run. Check every new or changed leaf: each one-shot read (`allTextContents`, `textContent`, `innerText`, `getAttribute`, `count`, `boundingBox`, `isVisible`, `evaluate`, `screenshot`, or a measuring helper) runs only after a web-first wait proves that what it reads from has rendered. `goto`, `waitForLoadState`, or a wait on an unrelated element doesn't count. This must not break step-04c's rule that the criterion assertion is the first operation that can fail. So the wait is on something that already ships and that the read depends on (the tile grid with its expected `toHaveCount(n)`, a loaded cover, the region's heading), never on the new feature itself. Or the read itself becomes the web-first criterion assertion (`await expect(locator).toHaveText(…)`, `expect.poll(() => helper()).toEqual(…)`, `toPass`), so the wait and the criterion are one operation. An absence read (no ribbon, `count` 0) waits on the rendered container or sibling that proves the region is drawn, and then asserts the absence. Fix any leaf that breaks this.""",
  """Record the probes in the ATDD checklist (Epic 8 retro item 66). The checklist gains a `## Helper probes` section, placed before the section that records the red phase (`## TDD Red Phase` in bookvie's checklists, or the template's `## Red-Phase Test Scaffolds Created`). Give each probed helper one line: the helper and its file, the known-good input and conditions, the expected value, the value it returned, the rejected value it correctly refused, and the probe's command. Say which helpers were reused unchanged and so weren't probed, and add one line confirming the render-before-read check over every new or changed leaf (naming any leaf it fixed). When no measuring helper was added or changed, write "Helper probes: none added or changed" and still record the render-before-read check. A red-phase claim (for example "fails at its first assertion") may cite only a run made after the probes it depends on last passed. In edit mode (`steps-e`), the three facts apply to the helpers and leaves the edit adds or changes, and the edit updates `## Helper probes`. In validate mode (`steps-v`), a missing `## Helper probes` section or a missing render-before-read line is a validation failure.""",
]
