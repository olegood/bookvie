# Team overrides for bmad-testarch-atdd. Committed; applies to every developer.
# Merges over .claude/skills/bmad-testarch-atdd/customize.toml (lists append).

[workflow]

persistent_facts = [
  """Probe every new measuring helper before the red run (Epic 8 retro item 66, PL-3). "Fails at its first assertion" can't tell a missing feature from a broken helper: in Story 8.2 all 7 red leaves failed at their first assertion, yet the pixel-sampling helper had three bugs that the build fixed without changing an assertion. When: in step 5, before the checklist is finalized, and before any red run (activating the skipped leaves to watch them fail), whether or not a red run happens. What: each measuring helper this run adds or changes, in e2e or unit tests: pixel or color sampling, geometry (rects, offsets, overlap), a wait or poll, a parser of rendered text. How: run it once against a known-good input whose right answer you know without the feature. Use either a `page.setContent` fixture you build with the exact value (a 10px `rgb(…)` block at a known offset, a box of known size), or a part of the app that already ships and shows the measured thing (an existing spine color, an existing element's rect). Check that it returns that exact value, and also that it refuses a value it should reject (a different color, an off-by-one rect), so a helper that always passes or always fails is caught. Run the probe under the same conditions as the leaves that call the helper: the same viewport, `deviceScaleFactor`, color scheme and forced-colors setting, once per distinct setting they use. Where: a temporary file named `*.probe.spec.ts` under `frontend/e2e/` (or `*.probe.test.ts` beside a unit helper), removed with `rm` afterwards, never with a git command (AGENTS.md "Story pipeline", Epic 8 retro item 64). The same goes for any throwaway un-skipped copy used for the red run. Before the checklist is finalized, `git status` must list no `*.probe.*` file and no throwaway copy. A helper this run reuses unchanged needs no probe; say so. If a probe returns the wrong value, fix the helper and probe again. Any change to a probed helper after its probe, including a fix the red run prompted, voids that probe and every red result recorded since: probe it again, then redo the red run.""",
  """No leaf reads the page before it has rendered (Epic 8 retro item 66, PL-3). In Story 8.1, a leaf read tile names right after `goto`, and the build hit that race. When: in step 5, before the checklist is finalized and before any red run. Check every new or changed leaf: each one-shot read (`allTextContents`, `textContent`, `innerText`, `getAttribute`, `count`, `boundingBox`, `isVisible`, `evaluate`, `screenshot`, or a measuring helper) runs only after a web-first wait proves that what it reads from has rendered. `goto`, `waitForLoadState`, or a wait on an unrelated element doesn't count. This must not break step-04c's rule that the criterion assertion is the first operation that can fail. So the wait is on something that already ships and that the read depends on (the tile grid with its expected `toHaveCount(n)`, a loaded cover, the region's heading), never on the new feature itself. Or the read itself becomes the web-first criterion assertion (`await expect(locator).toHaveText(…)`, `expect.poll(() => helper()).toEqual(…)`, `toPass`), so the wait and the criterion are one operation. An absence read (no ribbon, `count` 0) waits on the rendered container or sibling that proves the region is drawn, and then asserts the absence. Fix any leaf that breaks this.""",
  """Record the probes in the ATDD checklist (Epic 8 retro item 66). The checklist gains a `## Helper probes` section, placed before the section that records the red phase (`## TDD Red Phase` in bookvie's checklists, or the template's `## Red-Phase Test Scaffolds Created`). Give each probed helper one line: the helper and its file, the known-good input and conditions, the expected value, the value it returned, the rejected value it correctly refused, and the probe's command. Say which helpers were reused unchanged and so weren't probed, and add one line confirming the render-before-read check over every new or changed leaf (naming any leaf it fixed). When no measuring helper was added or changed, write "Helper probes: none added or changed" and still record the render-before-read check. A red-phase claim (for example "fails at its first assertion") may cite only a run made after the probes it depends on last passed. In edit mode (`steps-e`), the three probe facts above apply to the helpers and leaves the edit adds or changes, and the edit updates `## Helper probes`. In validate mode (`steps-v`), a missing `## Helper probes` section or a missing render-before-read line is a validation failure.""",
  """Never assert a fractional border or outline width through `toHaveCSS` (Epic 10 retro item 71, E10-R1). Chromium floors the computed `border-*-width` and `outline-width` to whole CSS pixels at every device scale factor (seen on Chromium 156; if a Playwright or Chromium upgrade changes this, the probe below is the authority), so `toHaveCSS('border-right-width', '1.5px')` can never pass: a 1.5px border reads as `1px`. Story 10.1's checklist asserted `1.5px` and the build had to rewrite those leaves; the Epic 1 retro had already recorded the same floor. When an AC or DESIGN.md gives a border or outline a width that isn't a whole pixel, the leaf asserts the floored value and also pins the source that sets the width, because the floored value alone can't tell 1.5px from 1px. Pin a token by reading it from the same element after the floored `toHaveCSS` (so the render-before-read fact holds), `expect(await el.evaluate((e) => getComputedStyle(e).getPropertyValue('--text-field-border').trim())).toBe('1.5px')`, or wrap that read in `expect.poll`, as `e6dcc1e` does in `frontend/e2e/catalog-sort-direction.spec.ts`. When no token sets the width, measure it another way that does tell the two apart, for example the declared value of the matching rule read through the CSSOM (`document.styleSheets`), and say how in the checklist. Never compare the width with the token's own value read back at run time: that is a tautology, which build 10.1 wrote and its review rejected. Before the red run, probe each such width read under the probe rule above, as if it were a new helper, even though `toHaveCSS` is built in: a `page.setContent` element with the exact fractional width, under the leaf's viewport and `deviceScaleFactor`, shows what the read really returns. Record it in `## Helper probes`. The checklist's rows name the floored value and the pinned token, never the fractional value as a computed width. In edit mode (`steps-e`) this applies to the leaves the edit adds or changes. In validate mode (`steps-v`), a `toHaveCSS` of a non-whole-pixel border or outline width, a checklist row that names one as a computed width, or such a read missing from `## Helper probes` is a validation failure.""",
  """Every new localStorage key joins `APP_STORAGE_KEYS` in the red phase (Epic 10 retro item 71, E10-R2). `frontend/e2e/catalog-filter.spec.ts` keeps `APP_STORAGE_KEYS`, the list of every key the app keeps in `localStorage`, and the leaf `[P2] AC-7 a filter leaves the remembered sort alone, and a sort change keeps the filters` fails when the page holds a key not on it. That leaf only sees the keys its own sort, filter and reload steps leave behind, so a key that only another feature writes is never checked: the list stays right only when each story keeps it right. Story 9.2 and Story 10.1 both added a key without adding it to the list, and each time a review caught it. When a story adds a `localStorage` key (a new key that any module under `frontend/src` reads or writes; find them with `grep -rn localStorage frontend/src` and the `STORAGE_KEY` constants it shows), the ATDD run adds it to `APP_STORAGE_KEYS` and to the comment above the list that names each key's owner. The leaf only checks that each stored key is on the list, so adding the key before the feature exists keeps that leaf green. When a story renames or removes a key, the run updates the list the same way. Record it in the checklist with one line, `Storage keys: added <key> to APP_STORAGE_KEYS`, or `Storage keys: no new localStorage key`. In edit mode (`steps-e`) the same applies to the keys the edit adds, renames or removes. In validate mode (`steps-v`), a missing storage-keys line, or a key from that grep missing from the list, is a validation failure. `sessionStorage` keys are out of scope: there is no list for them.""",
  """Reuse an e2e helper before writing a new one (Epic 11 retro item 78, E11-D1). Three epics in a row copied e2e helpers and needed a clean-up item afterwards: Epic 8 item 65, Epic 10 item 73, and Epic 11 item 77, after Epic 11's ATDD runs parsed DESIGN.md in three places, faked `app-info` with two helpers plus five inline `page.route('**/api/views/app-info', …)` calls, and copied the `AppInfo` type by hand. When: in step 4, including 4a, 4b and the fixture and helper infrastructure 4c creates, before a leaf or a helper module gets a new helper, type, constant, locator or route faker, whether it goes into a `frontend/e2e/*.ts` module or inline in a spec; an inline copy counts. Each generation subagent's prompt (steps 4a and 4b) carries this fact and asks it to return, in its output, the helpers it reused and the ones it added. The two run in parallel and can't see each other's files, so step 4c compares their added helpers and keeps one of any two that do the same job, before writing the checklist. How: list what already exists with `grep -n '^export' frontend/e2e/*.ts`, reading `frontend/e2e/library.ts` first, since it is the shared home (colors and `rgbOf`, the DESIGN.md readers `designColor`, `designComponentColor` and `designTokens`, `answerAppInfo` and the `AppInfo` type), then `frontend/e2e/fixtures.ts` (`test`, `startServer`, `seedLibrary`, `startSeededServer`, `Server`), then the other modules. Then look for inline copies in the specs: `grep -n "page.route('" frontend/e2e/*.spec.ts` for route fakers, and `grep -nE '^(async )?function |^const [A-Za-z]+ = ' frontend/e2e/*.spec.ts` for spec-local helpers. Take an API type from the generated schema (`components['schemas'][…]`, as `library.ts` does), never a hand copy. If one already does the job, import it from where it lives. If one nearly does, extend it with an optional parameter whose default keeps every existing caller's behavior, rather than writing a second version; an extended helper counts as changed, so the probe rule above applies to it. Write a new one only when none does the job; if it is general (not tied to this story's feature), put it in `library.ts`. Record it as the first lines of `## Helper probes`: `Helpers reused: <name> (<module>), …`, followed by `Helpers added: <name> (<module>): <what no existing helper does>`, or `Helpers added: none`. The `Helpers reused` line is also the probe facts' list of helpers reused unchanged and so not probed (mark any reused helper this run extended as "extended, probed"); don't write a second reuse list. `Helper probes: none added or changed`, when it applies, follows these lines. A copy that behaves differently on purpose (item 77 kept three inline `app-info` routes that way) is not a duplicate: say how it differs in the `Helpers added` line. The same holds for pytest (Epic 12 retro item 87, E12-D1, E12-D2): Epic 12's ATDD runs copied the agent tool list into about ten places across five `backend/tests/test_agent_*.py` files, copied each tool's description from `epics.md` into a test constant, and wrote four ways to read a tool's answer. Before a pytest module gets a new helper, constant, fixture or fake, run `grep -nE '^(def |class |[A-Z_][A-Z_0-9, ]*(: [^=]+)? = )' backend/tests/*.py` (it also finds tuple and annotated constants) and read `backend/tests/agent_client.py` first, since it is the agent tests' home (`McpClient`; `AGENT_TOOL_NAMES` and its groups `EARLIER_TOOL_NAMES`, `WRITE_TOOL_NAMES`, `BOOK_TOOL_NAMES`, `EXPORT_BACKUP`; `DESCRIPTIONS`, read from `epics.md`; the answer readers `structured_of`, `error_of` and `text_of`), then `helpers.py`, `builder.py`, `servers.py` and the fixtures in `conftest.py`. A new agent tool joins its group and `AGENT_TOOL_NAMES` in `agent_client.py`, and its description is read from `epics.md` there, never copied as a literal into a test. Import a helper from the module that defines it rather than from another story's test module when it lives in a shared one. Record pytest helpers on the same `Helpers reused` and `Helpers added` lines. In edit mode (`steps-e`) this applies to the helpers the edit adds or changes. In validate mode (`steps-v`), a missing `Helpers reused` line, or an added helper, type or inline route that does the same job as an existing export in `frontend/e2e/*.ts`, a definition in a shared `backend/tests/` module, or a type in the generated schema without a stated difference, is a validation failure.""",
  """Measure every number quoted for UI that already ships before asserting it (Epic 11 retro item 78, E11-R1). Story 11.3's ATDD asserted a card no wider than 560px, but the shipped `.card` renders 610px wide; Story 11.4's asserted a 64px top bar, but `--space-topbar-height` is 60px. In both, the build had to rewrite the red assertion. The probe rule above covers new helpers, not numbers the docs quote. What: any number an AC, the story spec, the epic context, DESIGN.md or EXPERIENCE.md gives for UI that ships before this story (a width, a height, an offset, a gap, a font size, a count, a token's value), when a leaf asserts it, bounds by it (`<= 560`), or derives an expected value from it. When: in step 5, together with the helper probes, before the checklist is finalized and before any red run. How: read a token's value from `frontend/src/styles/tokens.css` (`grep -n -- '--space-topbar-height' frontend/src/styles/tokens.css`). A token ships even when the element using it is new, so a token's value quoted for new UI is read the same way. When a token is redefined for dark (`:root[data-theme="dark"]` and the `prefers-color-scheme: dark` block), read the value for each color scheme the leaves use. A color DESIGN.md quotes is read with `designColor`, `designComponentColor` or `designTokens` from `library.ts`, never retyped. Measure a rendered size on the running app: a temporary `*.probe.spec.ts` that opens the shipped page with the e2e fixtures, waits web-first for the element, and reads its `boundingBox()` or `getComputedStyle`, under each viewport, `deviceScaleFactor` and color scheme the leaves use; remove it with `rm` afterwards, never with a git command, exactly like a helper probe. If the measurement matches, the leaf may assert the number. If it doesn't, decide what the AC means. When the AC describes the shipped UI as it is (11.3: the card is as wide as the other cards), the leaf asserts the measured value, or a relation to the shipped element measured in the same leaf (as build 11.3 did with `toBe(exportBox.width)`), and the checklist names the mismatch so the review can fix the spec's wording. When the AC changes the shipped UI on purpose, the number is this story's new behavior and the leaf asserts the AC's value; say so in the checklist. A size for UI this story adds is not shipped and is not measured, but any token or shipped element it is defined by is. Record them in `## Helper probes`, after the `Helpers` lines, one line per number: `Shipped numbers: <AC> quotes <value> for <what>; measured <value> (<token read, or the probe, its conditions and command>); <asserted as quoted | asserted as measured, mismatch noted | the AC changes it>`, or `Shipped numbers: none quoted`. In edit mode (`steps-e`) this applies to the leaves the edit adds or changes. In validate mode (`steps-v`), a missing `Shipped numbers` line, or a leaf that asserts a number for shipped UI that the line doesn't list as measured, is a validation failure.""",
]
