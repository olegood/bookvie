# Team overrides for bmad-create-epics-and-stories. Committed; applies to every developer.
# Merges over .claude/skills/bmad-create-epics-and-stories/customize.toml (lists append,
# arrays of tables merge by `code`/`id`).

[workflow]

persistent_facts = [
  """Check the Mac before planning on it (Epic 13 retro item 93, E13-P1). Story 13.5's 09:00 launchd job was planned, built, reviewed and merged (about 2,000 lines with tests) before anyone learned that this Mac's administration policy removes LaunchAgents. Planning had listed launchd as a build risk, never as a question of whether the machine allows it. So: in step 2 (Step B, each epic's Implementation Notes) and again in step 3 (each story's ACs), list everything a story needs from the Mac itself that nobody has yet seen work on Oleg's Mac. Examples: a scheduler or LaunchAgent, a system service or login item, a Keychain prompt or entry, a fixed local port, a feature of a client such as Claude Code's terminal CLI, VS Code or `claude -p` (MCP elicitation was one), an OS permission or a policy-managed setting. Something counts as seen only when Oleg says he has run it on this Mac or a spec records the run; that it is documented or works elsewhere doesn't count. Ask Oleg about each item. For every one he hasn't seen work: (1) order that story first in its epic, or as early as its dependencies allow, and say why in the epic text, as Epic 13 put Story 13.1 first because its gate 2 was "the one part nobody has seen work"; (2) add a `**Mac check before Story N.M:**` line under the epic's gate that names the manual check Oleg runs before that story's ATDD, what counts as passing, and where the result is recorded (under that line in `epics.md`, with the date, what ran and what happened); (3) add an `**If the Mac check fails for Story N.M:**` line, in the shape of Epic 13's "If gate 2 fails in Story 13.1", saying that the story, and every story that depends on it, stops for Oleg's decision while the others go on. A failed check is never worked around inside the story. Step 4's final validation confirms that every such story has both lines.""",
  """Check "pass unchanged" before promising it (Epic 15 retro item 104, E15-S1). Twice in a row an epic's gate promised that existing e2e specs "pass unchanged", and a story had to edit them anyway: Story 14.5 rewrote the Story 5.3 chip leaf in `card-notes.spec.ts` (the gate was amended by Epic 14 retro item 97), and Story 15.2 had to add Publisher ▾ to two leaves that Tab along the filter row (`catalog-filter.spec.ts` AC-4's Clear filters stop, `bookcase-details.spec.ts`'s toolbar Tab sequence; amended by Epic 15 retro item 102). Both times planning wrote the promise without opening the specs. So: whenever an epic's gate (step 2) or a story's AC (step 3) says existing specs or tests pass unchanged, first grep each named spec, and the e2e suite for the page the epic changes, for leaves that pin what the epic changes: a Tab or focus order, a list of chips, buttons or columns in sequence, the last or first item of a row, a count of items, a whole-row or whole-region text or snapshot, a removed or renamed control. For each leaf the change must break, either name it in the gate as an expected edit, in the shape of Epic 14's and Epic 15's gates ("with one exception: … so the leaf … includes it"), and say what stays unchanged, or drop "unchanged" for that file. Never leave a promise that a known leaf breaks. Step 4's final validation confirms that every "pass unchanged" in the new epics has had that grep, and lists the leaves it found. The grep also covers the repo-wide guard tests outside the e2e suite (Epic 16 retro item 110, E16-S1). Epic 16's gate named every e2e leaf the stories changed, yet Story 16.1 still edited three tests it didn't name: `frontend/scripts/copy.test.mjs`'s "nothing is red" check flagged the new favourite gold `#9A7120` (hue 39.8°, under its 40° limit) and needed a `FAVOURITE_GOLD` exception, and `test_store.py`'s Hypothesis Book strategy and `test_store_commits.py`'s newer-version parameter moved with the new stored field. Planning had added a color (UX-DR101) without running the color guards. So: when an epic adds or changes a color, a token, a copy string or a stored field, also run or grep these guards against the planned values: `frontend/scripts/copy.test.mjs` (its red-hue rule, saturation above 0.55 with a hue under 40° or over 345°, and its shouting, greeting, praise, key-shortcut, drag and hover-only rules), `frontend/e2e/app-shell.spec.ts`'s comparison of DESIGN.md tokens with `tokens.css`, and the backend's golden bytes, Hypothesis model strategies, field and key sets and schema-version pins (grep `backend/tests` for the old version number and for an existing field's name). Name each guard leaf that needs an edit or an exception in the gate, in the same shape as the e2e leaves, and say what stays unchanged in that file. Step 4's final validation lists these guard checks next to the e2e greps.""",
]
