# Team overrides for bmad-create-epics-and-stories. Committed; applies to every developer.
# Merges over .claude/skills/bmad-create-epics-and-stories/customize.toml (lists append,
# arrays of tables merge by `code`/`id`).

[workflow]

persistent_facts = [
  """Check the Mac before planning on it (Epic 13 retro item 93, E13-P1). Story 13.5's 09:00 launchd job was planned, built, reviewed and merged (about 2,000 lines with tests) before anyone learned that this Mac's administration policy removes LaunchAgents. Planning had listed launchd as a build risk, never as a question of whether the machine allows it. So: in step 2 (Step B, each epic's Implementation Notes) and again in step 3 (each story's ACs), list everything a story needs from the Mac itself that nobody has yet seen work on Oleg's Mac. Examples: a scheduler or LaunchAgent, a system service or login item, a Keychain prompt or entry, a fixed local port, a feature of a client such as Claude Code's terminal CLI, VS Code or `claude -p` (MCP elicitation was one), an OS permission or a policy-managed setting. Something counts as seen only when Oleg says he has run it on this Mac or a spec records the run; that it is documented or works elsewhere doesn't count. Ask Oleg about each item. For every one he hasn't seen work: (1) order that story first in its epic, or as early as its dependencies allow, and say why in the epic text, as Epic 13 put Story 13.1 first because its gate 2 was "the one part nobody has seen work"; (2) add a `**Mac check before Story N.M:**` line under the epic's gate that names the manual check Oleg runs before that story's ATDD, what counts as passing, and where the result is recorded (under that line in `epics.md`, with the date, what ran and what happened); (3) add an `**If the Mac check fails for Story N.M:**` line, in the shape of Epic 13's "If gate 2 fails in Story 13.1", saying that the story, and every story that depends on it, stops for Oleg's decision while the others go on. A failed check is never worked around inside the story. Step 4's final validation confirms that every such story has both lines.""",
  """Check "pass unchanged" before promising it (Epic 15 retro item 104, E15-S1). Twice in a row an epic's gate promised that existing e2e specs "pass unchanged", and a story had to edit them anyway: Story 14.5 rewrote the Story 5.3 chip leaf in `card-notes.spec.ts` (the gate was amended by Epic 14 retro item 97), and Story 15.2 had to add Publisher ▾ to two leaves that Tab along the filter row (`catalog-filter.spec.ts` AC-4's Clear filters stop, `bookcase-details.spec.ts`'s toolbar Tab sequence; amended by Epic 15 retro item 102). Both times planning wrote the promise without opening the specs. So: whenever an epic's gate (step 2) or a story's AC (step 3) says existing specs or tests pass unchanged, first grep each named spec, and the e2e suite for the page the epic changes, for leaves that pin what the epic changes: a Tab or focus order, a list of chips, buttons or columns in sequence, the last or first item of a row, a count of items, a whole-row or whole-region text or snapshot, a removed or renamed control. For each leaf the change must break, either name it in the gate as an expected edit, in the shape of Epic 14's and Epic 15's gates ("with one exception: … so the leaf … includes it"), and say what stays unchanged, or drop "unchanged" for that file. Never leave a promise that a known leaf breaks. Step 4's final validation confirms that every "pass unchanged" in the new epics has had that grep, and lists the leaves it found. The grep also covers the repo-wide guard tests outside the e2e suite (Epic 16 retro item 110, E16-S1). Epic 16's gate named every e2e leaf the stories changed, yet Story 16.1 still edited three tests it didn't name: `frontend/scripts/copy.test.mjs`'s "nothing is red" check flagged the new favourite gold `#9A7120` (hue 39.8°, under its 40° limit) and needed a `FAVOURITE_GOLD` exception, and `test_store.py`'s Hypothesis Book strategy and `test_store_commits.py`'s newer-version parameter moved with the new stored field. Planning had added a color (UX-DR101) without running the color guards. So: when an epic adds or changes a color, a token, a copy string or a stored field, also run or grep these guards against the planned values: `frontend/scripts/copy.test.mjs` (its red-hue rule, saturation above 0.55 with a hue under 40° or over 345°, and its shouting, greeting, praise, key-shortcut, drag and hover-only rules), `frontend/e2e/app-shell.spec.ts`'s comparison of DESIGN.md tokens with `tokens.css`, and the backend's golden bytes, Hypothesis model strategies, field and key sets and schema-version pins (grep `backend/tests` for the old version number and for an existing field's name). Name each guard leaf that needs an edit or an exception in the gate, in the same shape as the e2e leaves, and say what stays unchanged in that file. Step 4's final validation lists these guard checks next to the e2e greps. What "existing" means (Epic 17 retro item 113, E17-P2). Epic 17's gate missed three leaves Story 17.2 changed, and planning couldn't have listed them: `stats-finished.spec.ts:526` and `:531–535` were Story 17.1's own new leaves, and `stats.spec.ts:299` changed because of a mid-story decision (Oleg's option A, which excluded one axe rule for the bar buttons). So in a gate or AC, "existing tests" means tests that exist before the epic's first story, and the grep above covers only those. When a later story changes a leaf an earlier story of the same epic added, that story's own spec names the leaf, with what it keeps asserting, in its Code Map or Always list; the gate is not amended for it. When a decision made inside a story (a halt resolved by Oleg, a Spec Change Log entry) widens or rewrites a leaf the gate didn't name, the Spec Change Log entry for that decision names each leaf and says what it keeps asserting. Neither case is a breach of the gate, and a review doesn't raise it as one if the spec names the leaf. A leaf that existed before the epic, and that neither the gate, the story's spec nor a Spec Change Log entry names, is still a breach.""",
  """Check accessible names against axe before writing the ACs (Epic 17 retro item 116, E17-P1). Both Epic 17 builds halted on axe's `label-content-name-mismatch` (WCAG 2.5.3, Label in Name: the accessible name must contain the visible text). Story 17.1's finished-list row was named with "finished", a word its visible text didn't show (session `fee85da6` L622). Story 17.2's bar buttons were named "March 2026, 3 books, 912 pages" over the visible "912" and "Mar" (session `e41366f9` L328–429). Each halt waited hours on Oleg's choice, the epic's largest cost. The UX session had written the bar name as an exception to "the name starts with the label" (UX-DR109), but no planning session checked it against WCAG 2.5.3 or axe. So: in step 3, before writing a story's ACs, list every control or link the story names (a button, link, row, bar, chip or tab, from its ACs or the UX-DRs it cites) whose accessible name (`aria-label`, `aria-labelledby` or a spelled-out name) differs from its visible text: extra words, reordered or reformatted numbers, an abbreviation spelled out, or visible text split across several elements. For each, do one of two things. (1) Probe it. Write a temporary `frontend/e2e/<story>.probe.spec.ts` that sets a sketch of the planned markup with `page.setContent` (real element, role, name, visible text and `aria-hidden` parts, as the UX-DR gives them), runs `new AxeBuilder({ page }).withRules(['label-content-name-mismatch']).analyze()` (the suite's `AXE_TAGS` run it too, through `wcag21a`, in axe-core 4.14), and runs in Chromium with `npx playwright test <file>` inside `frontend/`. Record the result, then delete the file with `rm`, never with a git command (AGENTS.md "Story pipeline", Epic 8 retro item 64). (2) Or record Oleg's decision without a probe: either show the words, so that the visible text is in the name, or exclude the rule for those elements only, as `frontend/e2e/stats.ts` `statsAxeViolations` does for the bar buttons. If the probe fails, ask Oleg which of the two he wants before writing the ACs. Write the outcome into the story's ACs and the UX-DR it cites: the visible words the name contains, or the exclusion with its selector and the WCAG 2.5.3 reason, so the ATDD and the build start from a settled name and don't halt on it. Never leave a name that differs from its visible text with neither a passing probe nor a recorded decision. Step 4's final validation lists each such control with its outcome (probe passed, words shown, or rule excluded, with the date and Oleg's choice).""",
]
