# Team overrides for bmad-build-auto. Committed; applies to every developer.
# Merges over .claude/skills/bmad-build-auto/customize.toml (lists append,
# arrays of tables merge by `id`). The story-work rules mirror
# _bmad/custom/bmad-build.toml, adapted to this skill's steps (Epic 4 retro item 40).
# Pipeline specs (Epic 5 retro item 46) exist only here: bmad-build still sets
# `done` on a spec with no `story_key`.

[workflow]

persistent_facts = [
  """Story work and `story_key`. This run is story work when step-01 takes the epic story path with both `epic_num` and `story_num`, and `_bmad-output/implementation-artifacts/sprint-status.yaml` has a `development_status` key starting `{epic_num}-{story_num}-` (match the numbers exactly, so 3-1 never matches 3-10). That key is `story_key`. Anything else, such as a retro item, is non-story work: `story_key` is empty and the rules below that need it don't apply. The story pipeline is in AGENTS.md "Story pipeline".""",
  """Pipeline specs (Epic 5 retro item 46, PL-2). A spec with an empty `story_key` is a pipeline spec when it declares the story pipeline: a line that starts `- **Pipeline:**` and names `bmad-code-review` as a step after `bmad-build-auto` (for example "ATDD → `bmad-build-auto` → `bmad-code-review` → `bmad-testarch-automate`"). Decide it from the spec as it was before step-02 writes it. If the spec doesn't exist yet, decide it from the invocation prompt: it is a pipeline spec when the prompt asks for the story pipeline (AGENTS.md "Story pipeline") or names `bmad-code-review` as a later step. A pipeline spec follows the rules below that say "or a pipeline spec". The rules that need a story number (the spine gate, deferred-work intake, README) don't apply to it.""",
  """Keep the Pipeline line (Epic 5 retro item 46). Whenever step-02 writes `{spec_file}` for a pipeline spec (a first plan, a resumed draft, or a `bad_spec` loopback), its `## Design Notes` starts with the `- **Pipeline:**` line: carried over verbatim from the existing spec, or, when the prompt decided it, written as "- **Pipeline:** ATDD → `bmad-build-auto` → `bmad-code-review` → `bmad-testarch-automate` (AGENTS.md "Story pipeline")." The template has no Implementation Notes section. Keep `## Design Notes` even when the line is its only content, despite the template's "DELETE THIS ENTIRE SECTION". Later runs and bmad-code-review read the line from there.""",
  """Spec status ownership (story work or a pipeline spec). When `story_key` is set, bmad-code-review is the only step that marks a story `done`. So step-04's Finalize writes `status: in-review` into the spec frontmatter instead of `done`, sets `development_status[story_key]` to `review` before its commit, includes `sprint-status.yaml` in that commit, and HALTs with status `in-review`, not `done`, because HALT writes the final status back to the spec. A pipeline spec does the same, except that it has no `development_status` entry: leave `sprint-status.yaml` untouched, and write `Status: in-review` as the first line under `## Auto Run Result`. Whenever this run HALTs with `in-review` (a story or a pipeline spec), end the result with: "Next: run `bmad-code-review` in a new session (AGENTS.md \"Story pipeline\")." When step-04 starts a review of a pipeline spec and sets `status` to `in-review`, it first deletes a `Status: in-review` line left at the top of `## Auto Run Result` by an earlier run (bmad-code-review can send the spec back to `in-progress`), so an interrupted review never reads as parked. Otherwise, when `story_key` is empty, set the spec `status` to `done` and HALT with `done`, as the step says.""",
  """Parked story specs, or a pipeline spec (step-01). A story spec whose frontmatter `status` is `in-review` and whose `development_status` entry in sprint-status.yaml is `review` is parked for bmad-code-review. In step-01: do not take its `in-review` early exit to step-04, and do not review it again; HALT with status `in-review` and blocking condition `waiting for bmad-code-review`. For previous-story continuity, treat it as finished, exactly like a `done` spec. An `in-review` spec whose sprint entry is not `review` is an interrupted review, and keeps the default step-01 behaviour. A pipeline spec has no sprint entry, so it is parked when its frontmatter `status` is `in-review` and its `## Auto Run Result` starts with `Status: in-review`, which only Finalize writes, at the end of a finished run, and step-04 deletes when a new review starts. Without that line, it is an interrupted review.""",
  """Spine policy (AGENTS.md "Architecture spine"; Epic 3 retro item 24). The spine is reconciled once per epic, not per story. In step-04's triage, a spine-check finding where the code is right and ARCHITECTURE-SPINE.md is out of date is spine drift: triage it `defer`, and don't edit the spine. Its summary starts "Spine drift (<the AD it names>), reconciled before the next epic:". A spine-check finding where the code breaks a decision it should follow is fixed like any other finding.""",
  """Deferrals reach deferred-work.md (story work or a pipeline spec). step-04 writes deferrals to the spec's `deferred` list, which the retrospective and the spine gate don't read. So when `story_key` is set, or the spec is a pipeline spec, in Finalize and before its commit, append this pass's `defer` items to `_bmad-output/implementation-artifacts/deferred-work.md` under a heading `## Deferred from: build-auto review of <the spec's file name without .md> (<date>)`. Each item is a `- source_spec:` line with the spec's repo-relative path in backticks, then indented `summary:` and `evidence:` lines, as the file's other entries do. Keep the `deferred` list as the step says, and include `deferred-work.md` in the commit.""",
  """Spine gate at an epic's first story (step-01). When `story_key` is set and no other story of the same epic has a `development_status` past `ready-for-dev` (so this is the epic's first story), and the epic number N is above 1: read `deferred-work.md` and find the entries whose `source_spec` is a story spec of epic N-1 (`spec-{N-1}-*`) and that carry the marker "spine drift" in any letter case (entries usually write "Spine drift", so compare case-insensitively; match that phrase only, since "spine" alone also means a Book's spine on the shelf) and have no `resolved:` line. If there are any, HALT with status `blocked` and blocking condition `spine not reconciled with epic N-1`, listing them under `## Auto Run Result`, unless the invocation prompt says to proceed anyway, which you record in the spec. Non-story work skips this gate.""",
  """Deferred-work intake (story work; Epic 2 retro item 17, PL-2). When `story_key` is set, before writing the spec in step-02: read `_bmad-output/implementation-artifacts/deferred-work.md` and find every entry that names this story, by its number in any common form ("story X.Y", "Story X.Y", "before X.Y", "in X.Y", "X.Y's"; match the number exactly, so 3.1 never matches 3.10) and that has no `resolved:` line and no "Closed" note. Also take the entries that name this story's epic as a whole ("before Epic N", "in Epic N") when this is the epic's first story. In the spec's `## Code Map` add a "Deferred-work intake" list: one line per entry (its line number in `deferred-work.md` and its summary), each either turned into a task with an acceptance criterion, or marked "not in this story" with the reason. If there are none, write "Deferred-work intake: none name story X.Y". In step-04's Finalize, before the commit, add a `resolved: Story X.Y, <where>` line to each intake entry the story closed, and leave the others unchanged.""",
  """README is part of a story's done (story work; Epic 2 retro item 17, PL-7). The implementer reads only the spec, so when `story_key` is set, step-02 adds a task for `README.md`: the Status line (`README.md:8`) gains what the user can now do, and the documents list gains the story's spec link (and its ATDD checklist link when `_bmad-output/test-artifacts/atdd-checklist-{epic}-{story}-*.md` exists), placed after the previous story's links. The task leaves the Status line's "N of M stories done" count alone, since bmad-code-review moves the story to `done`.""",
  """No tree-wide git state changes (Epic 8 retro item 64, PL-2). Follow AGENTS.md "Story pipeline" (the paragraph on Epic 8 retro item 64); its list of banned commands is the one that counts, in every step of this run and in every subagent it launches. When step-04 says to revert code changes (`intent_gap`, `bad_spec`): save this run's uncommitted changes since `{baseline_revision}` as a patch (step-04 already asks for one on `intent_gap`), `git apply -R` that patch, delete the files this run created, and check `git status` that nothing else moved. If this run has made commits since `{baseline_revision}`, or the reverse apply fails, HALT with status `blocked`, blocking condition `revert needs a banned git command`, and leave the tree as it is. Put the rule, in one sentence, into the prompt of every subagent this run launches, including the fixed-prompt review layers below (append it to their prompt).""",
]

[[workflow.review_layers]]
id = "spine-check"
name = "Spine Check"
instruction = """
Before launch, resolve the project root (the directory that holds `_bmad/`) to an absolute path and replace every `<project-root>` below with it, and make `{claims_file}` absolute, so the child gets absolute paths only — its working directory is not yours.

Launch a context-free subagent with this prompt:

Read `<project-root>/_bmad/custom/review-prompts/spine-check.md` completely and follow it as your review instructions.

root: `<project-root>`

diff: the unified diff at `{diff_file}`. Read that file — it is the content under review.

spec_or_claims: {claims_file}

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
