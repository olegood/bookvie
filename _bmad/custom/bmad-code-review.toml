# Team overrides for bmad-code-review. Committed; applies to every developer.
# Merges over .claude/skills/bmad-code-review/customize.toml (lists append,
# arrays of tables merge by `id`).

[workflow]

persistent_facts = [
  """Resolve the spec/story pair as soon as one side is known (after step-01's Tier 1–3, before step-01 instruction 5 "Set the spec context"). If `spec_file` is set and `story_key` is empty: decide whether the spec is an epic story from its filename (`spec-{epic}-{story}-…`) or, failing that, its title, giving `epic_num` and `story_num`; if it is and `{sprint_status}` exists, find the `development_status` key matching `{epic_num}-{story_num}` by exact numeric equality on the first two segments (so `1-1` never collides with `1-10`) — exactly one match sets `story_key` to that full key; zero matches leave it empty; several leave it empty and warn. If `story_key` is set and `spec_file` is empty: look in `{implementation_artifacts}` for files named `spec-{story_key}.md` or `spec-{epic}-{story}-*.md` (epic and story = the first two segments of `story_key`, matched by exact numeric equality) and count distinct files; exactly one distinct file sets `spec_file` to it (so instruction 5 proceeds in `full` mode); none or several → ask the user for the spec path with instruction 5's existing question.""",
  """Status writes in step 4 §6. A bmad-build spec has no Status section: its status is the frontmatter `status:` field — write `new_status` (`done` or `in-progress`) there, not to a Status section. When both `story_key` and `spec_file` are set and `{sprint_status}` has a `development_status[{story_key}]` entry, write `new_status` to the spec frontmatter and to that entry in the same pass, so they always show the same value. If the sprint-status file or the `{story_key}` entry is missing, write `new_status` to the spec frontmatter only and tell the user the sprint sync was skipped and why. With no `story_key`, write `new_status` to the spec frontmatter `status:` and skip the sprint sync.""",
  """Spine policy (AGENTS.md "Architecture spine"; Epic 3 retro item 24). The spine is reconciled once per epic, not per story. In step-03 triage, a spine-check finding where the code is right and ARCHITECTURE-SPINE.md is out of date is spine drift: route it to `defer`, never `decision_needed` or `patch`, and never edit the spine in this review. Its `deferred-work.md` bullet names the AD and says "spine drift, reconciled before the next epic". Spine drift alone never stops the story from moving to `done`. A spine-check finding where the code breaks a decision it should follow is not drift: triage it like any other finding.""",
  """Epic boundary in step-04 §7 "Next steps" (Epic 3 retro item 30). Before presenting the options, if `story_key` is set and `new_status` is `done`, read `{sprint_status}`: the story closed its epic when every other `development_status` story key of the same epic (same first segment, by exact numeric equality) is `done`. If it did, replace option 1 "Start the next story" with these two, and renumber the rest: **Run test automation**, `bmad-testarch-automate` for this story; and **Run the Epic {epic_num} retrospective**, `bmad-retrospective` for epic {epic_num}. Say that the next epic starts only after its retrospective, even though sprint-status marks `epic-{epic_num}-retrospective` as `optional`, and that the epic's trace and gate and the spine reconciliation (AGENTS.md "Architecture spine") come before the next epic too. Never start a story of another epic from this review, whichever option the user picks and whatever wording it uses (for example "commit, then start the next story"): if a chained step would reach the first story of a new epic, stop there and offer the automate step and the retrospective instead. When the story is `done` and did not close its epic, replace option 1 with **Run test automation**, `bmad-testarch-automate` for this story, and say that the next story starts only after it (AGENTS.md "Story pipeline"; Epic 4 retro item 40). Never start the next story from this review, whichever option the user picks and whatever wording it uses. When `new_status` is not `done`, keep option 1 as written.""",
  """Full check after any patch, in step 4 §6 (Epic 8 retro item 63, PL-1). This gate runs before `new_status` is decided and before `done` is written anywhere (spec frontmatter, sprint-status). If §5 applied any patch, however small (a one-word wording fix or one test literal counts), run the full `npm run check` from the repo root in this session after the last patch. Re-running one spec file, one test, or one layer (`check:py`, `check:api`, `check:e2e`) doesn't count; neither does a run from before the last patch, nor the build's run. The check runs pytest, the unit tests, the build, the whole e2e suite and the smoke test, so give it a long timeout or run it in the background and wait for it to finish; never cut it short. If it exits 0, add one line to the spec's `### Review Findings` with the date, the exit code and the pytest, unit and e2e pass counts. If it fails: a failure in a file the review patched, or one the patch could cause, is fixed as another patch (written to `### Review Findings` as a checked `[Review][Patch]` item), then the full check runs again. A failure that looks unrelated or flaky gets at most one more full run; record both runs' results in `### Review Findings`, and if the second run fails too, set `new_status` = `in-progress` and report the failing output to the user. Never mark `done` on a run that failed. A review with no patch doesn't need the re-run: its bookkeeping writes alone (the spec, `sprint-status.yaml`, `deferred-work.md`) don't trigger it.""",
  """Review commit type (Epic 8 retro item 63, PL-1). This skill has no commit step; when this session commits the review's changes, the conventional-commit type follows the files the commit changes, not the step that made them. Use `docs:` only when every changed file is Markdown or `sprint-status.yaml`. Otherwise, by the most significant file: `fix:` (or `refactor:` for a behaviour-preserving change) when any source file changes (`backend/bookvie/`, `frontend/src/` outside tests, CSS included); else `test:` when the other files are tests (`frontend/e2e/`, `*.test.ts`/`*.test.tsx`/`*.test.mjs`, `backend/tests/`); else `chore:` (scripts, config such as `package.json`, `pyproject.toml` or `playwright.config.ts`, and `_bmad/` files). Keep the existing subject shape: `<type>: <what the patch changed> and close the review (story X.Y)`, as in `f8691aa fix: refuse non-ISO stats dates and close the review (story 6.3)` and `a12fb25 test: tighten the Stats bars e2e and close the review (story 6.4)`. A review with no patch keeps `docs: record the code review and mark the story done (story X.Y)`.""",
  """No README updates from stories (Oleg, 2026-11-14; replaces Epic 2 retro item 17, PL-7). `README.md` has no Status line any more, and stories don't add their spec or ATDD checklist links to its documents list. Story work doesn't edit `README.md` unless the story itself is about the README.""",
]

[[workflow.review_layers]]
id = "spine-check"
name = "Spine Check"
instruction = """
Before launch, resolve the project root (the directory that holds `_bmad/`) to an absolute path and replace every `<project-root>` below with it, and make `{spec_file}` absolute, so the child gets absolute paths only — its working directory is not yours.

Launch a context-free subagent with this prompt:

Read `<project-root>/_bmad/custom/review-prompts/spine-check.md` completely and follow it as your review instructions.

root: `<project-root>`

diff: the unified diff at `{diff_file}`. Read that file — it is the content under review.

spec_or_claims: {spec_file}

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
