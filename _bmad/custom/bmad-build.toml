# Team overrides for bmad-build. Committed; applies to every developer.
# Merges over .claude/skills/bmad-build/customize.toml (lists append,
# arrays of tables merge by `id`).
# The pipeline-spec definition below copies _bmad/custom/bmad-build-auto.toml's
# (Epic 5 retro item 46); change both together.

[workflow]

persistent_facts = [
  """Pipeline specs (Epic 5 retro items 46 and 47), as in `_bmad/custom/bmad-build-auto.toml`. A spec with an empty `story_key` is a pipeline spec when it declares the story pipeline: a line that starts `- **Pipeline:**` and names `bmad-code-review` as a step after `bmad-build-auto`. Decide it from the spec as it was before step-02 writes it. If the spec doesn't exist yet, decide it from the request: it is a pipeline spec when the request asks for the story pipeline (AGENTS.md "Story pipeline") or names `bmad-code-review` as a later step. Whenever step-02 or a later step writes the spec of a pipeline spec, keep the `- **Pipeline:**` line verbatim (write "- **Pipeline:** ATDD → `bmad-build-auto` → `bmad-code-review` → `bmad-testarch-automate` (AGENTS.md "Story pipeline")." when the request decided it) as the first bullet of `## Implementation Notes` on the oneshot route, or of `## Design Notes` on the full route, keeping that section even when the line is its only content.""",
  """Story builds use bmad-build-auto (step-01; Epic 5 retro item 47, PL-4). Stop before step-02 when step-01 has resolved `story_key`, when it identified the work as an epic story (`epic_num` and `story_num`) even though no key resolved, or when the work is a pipeline spec. Tell the user that the story pipeline builds with `bmad-build-auto` (AGENTS.md "Story pipeline", step 2), and that bmad-code-review then runs in a new session. Offer to stop so they can run `bmad-build-auto`, or to continue here, and wait. Continue only when the user explicitly says to continue with bmad-build, in reply or in the invocation prompt; a prompt that merely invokes bmad-build or names a story (for example `/bmad-build 5.1`) is not that. When they do, carry the choice into step-02's spec write as a line in the same section as the Pipeline line ("Built with bmad-build at the user's request, <date>."). Non-story work that is not a pipeline spec, such as retro items, skips this.""",
  """Spec status ownership (story work or a pipeline spec). When `story_key` is set, bmad-code-review is the only step that marks a story `done`. So every step of this run that would set the spec frontmatter `status` to `done` (step-05 "Mark Spec Done", step-oneshot "Finalize Spec") sets it to `in-review` instead; sprint-status is still synced to `review` exactly as the step says. A pipeline spec also ends at `in-review`, with no sprint-status write, since it has no `development_status` entry. It also gets `## Auto Run Result` at the end of the spec with the first line `Status: in-review`, the marker build-auto parks on. Otherwise, when `story_key` is empty (non-story work such as retro items), set the spec `status` to `done` as the step says.""",
  """Parked story specs (step-01). A story spec whose frontmatter `status` is `in-review` and whose `development_status` entry in sprint-status.yaml is `review` is parked for bmad-code-review. In step-01: do not list it as active work when scanning artifacts; if the user explicitly asks to resume it (by path, name, or a recent message), do not early-exit to step-04 — tell them it is waiting for bmad-code-review and stop; and for previous-story continuity, treat it as finished, exactly like a `done` spec (load it without asking). An `in-review` spec whose sprint entry is not `review` keeps the default step-01 behaviour. A pipeline spec at `in-review` whose `## Auto Run Result` starts with `Status: in-review` is parked in the same way: tell the user it is waiting for bmad-code-review and stop. Without that line, its review was interrupted, and the default step-01 behaviour applies (early exit to step-04).""",
  """Spine policy (AGENTS.md "Architecture spine"; Epic 3 retro item 24). The spine is reconciled once per epic, not per story. In this run's review, treat a spine-check finding where the code is right and ARCHITECTURE-SPINE.md is out of date as spine drift: defer it to `deferred-work.md` (naming the AD, "spine drift, reconciled before the next epic") and don't edit the spine. A spine-check finding where the code breaks a decision it should follow is fixed like any other finding.""",
  """Spine gate at an epic's first story (step-01). When `story_key` is set and no other story of the same epic has a `development_status` past `ready-for-dev` (so this is the epic's first story), and the epic number N is above 1: read `deferred-work.md` and find the entries whose `source_spec` is a story spec of epic N-1 (`spec-{N-1}-*`) and that carry the marker "spine drift" in any letter case (the code-review spine policy writes it into every drift entry, usually as "Spine drift", so compare case-insensitively; match that phrase only, since "spine" alone also means a Book's spine on the shelf) and have no `resolved:` line. If there are any, stop before planning: list them and tell the user that the spine must be reconciled with epic N-1 first (the retro's reconciliation action item), or that they can say to proceed anyway, which you record in the spec. Non-story work (empty `story_key`) skips this gate.""",
  """Deferred-work intake (story work; Epic 2 retro item 17, PL-2). When `story_key` is set, before writing the spec in step-02 (both the full and the oneshot route): read `_bmad-output/implementation-artifacts/deferred-work.md` and find every entry that names this story, by its number in any common form ("story X.Y", "Story X.Y", "before X.Y", "in X.Y", "X.Y's"; match the number exactly, so 3.1 never matches 3.10) and that has no `resolved:` line and no "Closed" note. Also take the entries that name this story's epic as a whole ("before Epic N", "in Epic N") when this is the epic's first story. In the spec's `## Code Map` add a "Deferred-work intake" list: one line per entry (its line number in `deferred-work.md` and its summary), each either turned into a task with an acceptance criterion, or marked "not in this story" with the reason. If there are none, write "Deferred-work intake: none name story X.Y". In step-05, before the commit, add a `resolved: Story X.Y, <where>` line to each intake entry the story closed, and leave the others unchanged. Non-story work (empty `story_key`) skips this intake.""",
  """README is part of a story's done (story work; Epic 2 retro item 17, PL-7). When `story_key` is set, step-03 updates `README.md` as part of the implementation, not when the user asks: the Status line (`README.md:8`) gains what the user can now do, and the documents list gains the story's spec link (and its ATDD checklist link when `_bmad-output/test-artifacts/atdd-checklist-{epic}-{story}-*.md` exists), placed after the previous story's links. Leave the Status line's "N of M stories done" count alone, since bmad-code-review moves the story to `done`. step-03's Tasks & Acceptance Verification treats a missing README update as an unfinished task.""",
]

[[workflow.review_layers]]
id = "spine-check"
name = "Spine Check"
instruction = """
Before launch, resolve the project root (the directory that holds `_bmad/`) to an absolute path and replace every `<project-root>` below with it, and make `{claims_file}` absolute, so the child gets absolute paths only — its working directory is not yours.

Launch a context-free subagent with this prompt:

Read `<project-root>/_bmad/custom/review-prompts/spine-check.md` completely and follow it as your review instructions.

root: `<project-root>`

diff: the unified diff at `{diff_file}`. Read that file — it is the content under review.

spec_or_claims: {claims_file}

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
