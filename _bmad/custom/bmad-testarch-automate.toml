# Team overrides for bmad-testarch-automate. Committed; applies to every developer.
# Merges over .claude/skills/bmad-testarch-automate/customize.toml (lists append).

[workflow]

persistent_facts = [
  """A story is `done` only at HEAD (Epic 13 retro item 94, E13-P2; AGENTS.md "Story pipeline" step 4). When this run covers a story (a `story_key`, a story spec `spec-{epic}-{story}-…md`, or a story named by the user), check before step-01's stack detection, before reading or generating anything else. Find the story's `development_status` key in `_bmad-output/implementation-artifacts/sprint-status.yaml` (first two segments matched by exact numeric equality, so `1-1` never matches `1-10`) and read its value from HEAD with `git show HEAD:_bmad-output/implementation-artifacts/sprint-status.yaml`, not from the working tree. Go on only when HEAD says `done`. If HEAD says anything else and the working tree says `done`, the review's record is uncommitted: stop, generate nothing, and tell the user to commit the review's record in the review's session (or by hand), then run automate again. Name the uncommitted paths from `git status --porcelain` (the spec, `deferred-work.md`, `sprint-status.yaml`). If neither says `done`, stop: the story is not done, and automate runs only after `bmad-code-review` marks it `done`. Never commit, stage or edit the review's record yourself to get past this check, and never cite a working-tree `done` as permission. When this run commits, it stages only the files it created or changed (tests, `automation-summary.md`, the ATDD checklist), by name, never `git add -A`, `git add .` or `git commit -a`. In Story 13.1, automate session `ed93b05a` saw an uncommitted `done`, generated tests, committed `a8c47d3` while HEAD said `review`, and then committed the review's record as `1b38535`.""",
  """Tick the ATDD checklist as tests go green (Epic 2 retro item 18, F-S3). When this run covers a story that has `_bmad-output/test-artifacts/atdd-checklist-{epic}-{story}-*.md`, finish by resolving that checklist's `- [ ]` lines (nested ones too, and the "Green-phase follow-ups" section) against the tests this run added or ran green. A line a passing test now proves: change it to `- [x]` and append ` (done: <test file>:<line or test name>)`. A line this run decided not to automate, or one a later change made moot: rewrite it as `- ~~<original text>~~ **Retired:** <reason>`, pointing at the `deferred-work.md` entry, spec or file:line that carries it (the convention in `atdd-checklist-1-10-see-the-library-as-a-bookcase.md:185-188`). Leave a line `[ ]` only while it is still planned for later work, and name that work in the run summary. Tick only with evidence from this run or the code you read, never on the scaffold's word. Report the checklist's remaining `[ ]` count (`grep -cF '[ ]'`) in the automation summary.""",
  """Reuse a test helper before writing a new one (Epic 14 retro item 100, E14-D1; Epic 11 retro item 78). The rule is the fact in `_bmad/custom/bmad-testarch-atdd.toml` that starts "Reuse an e2e helper before writing a new one": read it there and follow its How (the `grep -n '^export' frontend/e2e/*.ts` listing with `library.ts` first, the spec-local `grep -nE` for inline copies, import or extend with an optional parameter before writing, a general helper goes in `library.ts`; the pytest half for `backend/tests/`). It is not copied here, so the two can't drift. When: before this run, or any subagent it launches, adds a helper, type, constant, locator or route faker to a `frontend/e2e/*.ts` module, a spec, or `backend/tests/`, inline copies included; each generation subagent's prompt carries this fact. Two parallel subagents can't see each other's files, so compare their added helpers before writing and keep one of any two that do the same job. The run's summary names each helper it added and why no existing one did the job, or says none was added. In Epic 14, `openPaused` reached four copies and `resting` and `HABIT_STATE` two, and both the build and automate added some, because the rule lived only in the ATDD step.""",
  """Automate adds tests only and never fixes production code (Epic 14 retro item 101, E14-P1; AGENTS.md "Story pipeline": only `bmad-code-review` marks a story `done`). This run, and every subagent it launches (each generation subagent's prompt carries this fact), may create or edit test files and test support only: `frontend/e2e/` (specs, helper modules, fixtures), `*.test.ts`/`*.test.tsx` and `frontend/src/test-support/` under `frontend/src/`, `backend/tests/`, plus this step's own records (`automation-summary.md`, the ATDD checklist, `deferred-work.md`). It never edits anything else under `frontend/src/`, `backend/bookvie/` or `backend/bookvie_dropbox/`, however small or obvious the fix, and never regenerates `schema.d.ts`. When a test this run writes exposes a production defect: (1) leave the code alone; (2) keep no failing test in the commit: drop the leaf, or keep it as `test.fixme(...)` / `@pytest.mark.xfail(strict=True, reason=...)` whose reason names the defect; (3) add a `deferred-work.md` entry under `## Deferred from: automate of spec-{epic}-{story}-… (YYYY-MM-DD)` with `source_spec`, a `summary` that states the defect, how the test shows it and a severity, and `evidence` (the test file:line and the observed vs expected); (4) say it in the automation summary and the final message, and recommend a fix spec run through `bmad-build-auto` then `bmad-code-review` (a high-severity defect goes to the user before anything else). Before committing, check `git diff --cached --name-only` lists no file outside the allowed set. The commit stays `test:`. In Story 14.2, automate commit `bbb8174` edited `frontend/src/components/CardNoteBox.tsx` after the review commit `3fc7763` had marked the story `done`: a correct one-space fix that no review saw, mixed into a test commit.""",
]
