# Team overrides for bmad-testarch-automate. Committed; applies to every developer.
# Merges over .claude/skills/bmad-testarch-automate/customize.toml (lists append).

[workflow]

persistent_facts = [
  """A story is `done` only at HEAD (Epic 13 retro item 94, E13-P2; AGENTS.md "Story pipeline" step 4). When this run covers a story (a `story_key`, a story spec `spec-{epic}-{story}-…md`, or a story named by the user), check before step-01's stack detection, before reading or generating anything else. Find the story's `development_status` key in `_bmad-output/implementation-artifacts/sprint-status.yaml` (first two segments matched by exact numeric equality, so `1-1` never matches `1-10`) and read its value from HEAD with `git show HEAD:_bmad-output/implementation-artifacts/sprint-status.yaml`, not from the working tree. Go on only when HEAD says `done`. If HEAD says anything else and the working tree says `done`, the review's record is uncommitted: stop, generate nothing, and tell the user to commit the review's record in the review's session (or by hand), then run automate again. Name the uncommitted paths from `git status --porcelain` (the spec, `deferred-work.md`, `sprint-status.yaml`). If neither says `done`, stop: the story is not done, and automate runs only after `bmad-code-review` marks it `done`. Never commit, stage or edit the review's record yourself to get past this check, and never cite a working-tree `done` as permission. When this run commits, it stages only the files it created or changed (tests, `automation-summary.md`, the ATDD checklist), by name, never `git add -A`, `git add .` or `git commit -a`. In Story 13.1, automate session `ed93b05a` saw an uncommitted `done`, generated tests, committed `a8c47d3` while HEAD said `review`, and then committed the review's record as `1b38535`.""",
  """Tick the ATDD checklist as tests go green (Epic 2 retro item 18, F-S3). When this run covers a story that has `_bmad-output/test-artifacts/atdd-checklist-{epic}-{story}-*.md`, finish by resolving that checklist's `- [ ]` lines (nested ones too, and the "Green-phase follow-ups" section) against the tests this run added or ran green. A line a passing test now proves: change it to `- [x]` and append ` (done: <test file>:<line or test name>)`. A line this run decided not to automate, or one a later change made moot: rewrite it as `- ~~<original text>~~ **Retired:** <reason>`, pointing at the `deferred-work.md` entry, spec or file:line that carries it (the convention in `atdd-checklist-1-10-see-the-library-as-a-bookcase.md:185-188`). Leave a line `[ ]` only while it is still planned for later work, and name that work in the run summary. Tick only with evidence from this run or the code you read, never on the scaffold's word. Report the checklist's remaining `[ ]` count (`grep -cF '[ ]'`) in the automation summary.""",
]
